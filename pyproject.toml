[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-forge"
version = "0.2.1"
description = "Autonomous plan-and-execute coding loop over any models you bring."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["llm", "agent", "codegen", "llama.cpp", "claude", "automation"]
authors = [{ name = "Nik" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
# No runtime dependencies on purpose. The daemon has to start on every machine
# a run might live on, and a failed `pip install` is a bad way to find out that
# an overnight run never began.
dependencies = []

# Lint is not optional. The repository is flake8-clean and `tests/test_lint.py`
# fails rather than skips when the tool is missing, because an enforcement that
# disappears on the machine without it enforces nothing. `pytest` is here for
# the same reason: the suite is how any of this is checked.
[project.optional-dependencies]
dev = ["flake8>=7", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/nschroeder8472/hybrid-forge"
Repository = "https://github.com/nschroeder8472/hybrid-forge"
Issues = "https://github.com/nschroeder8472/hybrid-forge/issues"

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.setuptools.package-data]
forge = ["ui/*.html"]

[tool.pytest.ini_options]
# Only this project's own suite. `examples/sample-project` is a fixture with
# suites of its own, written to be run by the loop from inside that tree — a
# collector reaching into it imports them against the wrong root and fails
# before it can say why. `tests/test_sample_project.py` runs them properly,
# as subprocesses, with each build's own configured command.
testpaths = ["tests"]
