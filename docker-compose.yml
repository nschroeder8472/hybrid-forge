services:
  llamacpp:
    # The CUDA image. Vulkan will run, and on a 5090 with a 30B A3B MoE at
    # Q4_K_M it measured 16 tok/s against 353 tok/s on CUDA — the difference
    # between a run that finishes overnight and one that does not.
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: forge-llamacpp
    restart: unless-stopped
    # Host networking so the container can bind directly to a host interface.
    # With this mode `ports:` is ignored — --host controls the bind address.
    network_mode: host
    # Router mode. --models-preset reads the INI `forge models` writes: one
    # section per model id, one child server spawned per section on an
    # ephemeral port, proxied by id. That is what lets the loop alternate
    # roles across checkpoints on a single endpoint.
    #
    # --models-max 1 keeps one checkpoint resident at a time. Raise it only if
    # every model in the preset fits in VRAM together; the role that finds out
    # otherwise is the one whose child server exits mid-run.
    #
    # Bind to one specific interface. llama-server has no authentication;
    # 0.0.0.0 would publish an open inference endpoint to every network this
    # host is attached to.
    command: >
      --host ${BIND_ADDR}
      --port ${LLAMA_PORT:-8080}
      --models-preset /presets/llamacpp.ini
      --models-max ${LLAMA_MODELS_MAX:-1}
    volumes:
      # Weights live on the host filesystem, not in an image layer. Read
      # directly off NVMe, survive every teardown, and keep the image small.
      - "${MODELS_DIR}:/models:ro"
      # The generated preset, from the project's .hybridforge/models/.
      - "${PRESET_DIR}:/presets:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # The router answers /health without holding a model, so this reports the
      # router being up rather than any checkpoint being loaded — which is what
      # you want, since forge loads them on demand.
      test: ["CMD-SHELL", "curl -fsS http://${BIND_ADDR}:${LLAMA_PORT:-8080}/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # MemPalace's default CMD is `mcp` — the MCP server over stdio, which is what
  # the daemon drives. That makes it a child process, not a service: a stdio
  # server exits when its stdin closes, so `restart: unless-stopped` here would
  # be a crash loop rather than availability.
  #
  # (MemPalace 3.6 does have `serve`, a real HTTP listener with bearer-token
  # auth, for a palace on a different machine than the daemon. That case wants
  # its own long-running service — see docs/SETUP.md §1.4.)
  #
  # For the same-machine case the daemon starts the palace itself. Set in
  # .hybridforge/config.json:
  #
  #   "memory": {
  #     "command": ["docker", "run", "--rm", "-i",
  #                 "-v", "mempalace-data:/data",
  #                 "ghcr.io/mempalace/mempalace:latest"],
  #     "room": "your-project"
  #   }
  #
  # `-i` is load-bearing: JSON-RPC needs stdin held open. Drop `docker run`
  # entirely if MemPalace is installed on the host — ["mempalace", ...] is the
  # same thing without a container between the daemon and the palace.
  #
  # This entry exists so `docker compose run mempalace` works for maintenance
  # (`mine`, `sweep`) against the same volume the daemon uses. It is deliberately
  # not started by `docker compose up`.
  mempalace:
    profiles: ["tools"]
    image: ghcr.io/mempalace/mempalace:latest
    container_name: forge-mempalace
    stdin_open: true
    tty: false
    volumes:
      # The palace database. One authoritative copy, on the host, forever.
      - mempalace-data:/data

volumes:
  mempalace-data:
    # Named explicitly, against Compose's default of prefixing the project
    # directory. Two reasons, both about the palace outliving this checkout:
    # the daemon reaches it through `memory.command`, which is a plain
    # `docker run` with no project prefix to inherit; and a durable store keyed
    # off a folder name vanishes the day the folder is renamed.
    name: mempalace-data
    driver: local
