<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hybrid Forge</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #0f1115;
  --panel: #171a21;
  --panel-2: #1e222b;
  --line: #2a2f3a;
  --text: #e6e8ee;
  --muted: #949cad;
  --accent: #6ea8fe;
  --ok: #58d68d;
  --warn: #f5b041;
  --err: #ec7063;
  --wait: #bb8fce;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  position: sticky; top: 0; z-index: 10;
}
h1 { font-size: 15px; margin: 0; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.status {
  font-family: var(--mono); font-size: 13px; padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel-2);
}
.status.running { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.status.waiting_budget { color: var(--wait); border-color: color-mix(in srgb, var(--wait) 40%, transparent); }
.status.paused { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.status.blocked, .status.failed { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, transparent); }
.status.done { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.spacer { flex: 1; }
button {
  font: inherit; color: var(--text); background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; cursor: pointer;
}
button:hover { border-color: var(--accent); }
button.stop:hover { border-color: var(--err); color: var(--err); }
main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(360px, 1.2fr); gap: 16px; padding: 16px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
section > h2 {
  margin: 0; padding: 10px 14px; font-size: 12px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line);
}
.body { padding: 12px 14px; }
.goal { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
.bar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; margin-bottom: 12px; }
.bar > i { display: block; height: 100%; background: var(--ok); transition: width .3s; }
.notice {
  margin: 0 0 12px; padding: 8px 12px; border-radius: 6px; font-size: 13px;
  background: color-mix(in srgb, var(--wait) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--wait) 35%, transparent);
}
ul { list-style: none; margin: 0; padding: 0; }
.ticket { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--line); }
.ticket:first-child { border-top: 0; }
.ticket .id { font-family: var(--mono); font-size: 12px; color: var(--accent); min-width: 74px; }
.ticket .title { flex: 1; }
.ticket .note { display: block; color: var(--warn); font-size: 12px; }
.pill { font-size: 11px; font-family: var(--mono); padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.pill.done, .pill.ok { color: var(--ok); } .pill.running { color: var(--accent); }
.pill.blocked, .pill.failed { color: var(--err); } .pill.skipped { color: var(--wait); }
/* Ran, and answered neither way. See `Store.restate_step`. */
.pill.inconclusive { color: var(--warn); }
#log { max-height: 46vh; overflow-y: auto; font-family: var(--mono); font-size: 12.5px; }
#log div { padding: 3px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; }
#log div:first-child { border-top: 0; }
#log time { color: var(--muted); flex-shrink: 0; }
#log .warn { color: var(--warn); } #log .error { color: var(--err); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding-bottom: 6px; }
td { padding: 4px 0; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; }
td:last-child, th:last-child { text-align: right; }
.empty { color: var(--muted); font-style: italic; }

/* Steps read as a transcript rather than a list of names. The detail was
   always in the payload and was never rendered — for a model step it is the
   reply itself, which is the closest thing the loop has to showing its work. */
.step { border-top: 1px solid var(--line); padding: 0; }
.step:first-child { border-top: 0; }
.step > .head {
  display: flex; gap: 10px; align-items: baseline; padding: 7px 0; cursor: pointer;
}
.step > .head:hover .title { color: var(--accent); }
.step .caret { color: var(--muted); font-size: 10px; width: 10px; flex-shrink: 0; }
.step .id { font-family: var(--mono); font-size: 12px; color: var(--accent); min-width: 74px; }
.step .title { flex: 1; font-family: var(--mono); font-size: 12.5px; }
.step .took { color: var(--muted); font-size: 11px; font-family: var(--mono); }
.step.voice .title { color: var(--text); }
.step.tool .title { color: var(--muted); }
.step .snip {
  margin: 0 0 9px 20px; padding: 8px 10px; border-radius: 6px;
  background: var(--panel-2); border: 1px solid var(--line);
  font-family: var(--mono); font-size: 12px; line-height: 1.55;
  white-space: pre-wrap; overflow-wrap: anywhere;
  max-height: 30vh; overflow-y: auto; color: var(--muted);
}
/* The model's own words, so they read as prose and not as tool output. */
.step.voice .snip { color: var(--text); white-space: pre-wrap; }
.step.failed .snip { border-color: color-mix(in srgb, var(--err) 32%, transparent); }
.step.inconclusive .snip { border-color: color-mix(in srgb, var(--warn) 32%, transparent); }
.step .peek {
  flex: 1; color: var(--muted); font-size: 12px; font-family: var(--mono);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
}
.step.running .title { color: var(--accent); }
.pulse {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); animation: pulse 1.1s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
#steps { max-height: 60vh; overflow-y: auto; }
</style>
</head>
<body>
<header>
  <h1>Hybrid Forge</h1>
  <span class="status" id="status">connecting</span>
  <span id="progress" class="goal" style="margin:0"></span>
  <span class="spacer"></span>
  <button id="pause">Pause</button>
  <button id="resume">Resume</button>
  <button id="stop" class="stop">Stop</button>
</header>

<main>
  <section>
    <h2>Backlog</h2>
    <div class="body">
      <p class="goal" id="goal"></p>
      <div class="bar"><i id="barfill" style="width:0"></i></div>
      <div id="notice"></div>
      <ul id="tickets"><li class="empty">No run yet.</li></ul>
    </div>
  </section>

  <section>
    <h2>Activity</h2>
    <div class="body" id="log"></div>
  </section>

  <section>
    <h2>Steps</h2>
    <div class="body"><ul id="steps"><li class="empty">Nothing yet.</li></ul></div>
  </section>

  <section>
    <h2>Token usage</h2>
    <div class="body">
      <table>
        <thead><tr><th>Model</th><th>Calls</th><th>Tokens</th></tr></thead>
        <tbody id="usage"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const clock = (ts) => new Date(ts * 1000).toLocaleTimeString();

async function control(command) {
  await fetch("/api/control", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ command }),
  });
  refresh();
}
$("pause").onclick = () => control("pause");
$("resume").onclick = () => control("resume");
$("stop").onclick = () => {
  // Stopping ends the run; the daemon will not restart it on its own.
  if (confirm("Stop the run? It will finish the current step, then exit.")) control("stop");
};

function renderTickets(tickets) {
  if (!tickets.length) return '<li class="empty">No tickets.</li>';
  return tickets.map(t => `
    <li class="ticket">
      <span class="id">${esc(t.id)}</span>
      <span class="title">${esc(t.title)}${t.note ? `<span class="note">${esc(t.note)}</span>` : ""}</span>
      <span class="pill ${esc(t.status)}">${esc(t.status)}${t.attempts > 1 ? ` ×${t.attempts}` : ""}</span>
    </li>`).join("");
}

// Steps whose detail is a model's reply rather than a tool's output. Worth
// telling apart: one is prose to read, the other is a diagnostic to scan.
const VOICE = /^(build|tests|review|ratify|record|respec|stuck-review|reproduce|locate|bug)\b/;

// Steps the reader has opened or closed by hand. The newest is open by
// default, and stays open unless it is closed here — so a run left alone reads
// as a transcript, and one being read does not jump around under the cursor.
const opened = new Set();
const closed = new Set();

function isOpen(step, newest) {
  if (opened.has(step.id)) return true;
  if (closed.has(step.id)) return false;
  return step.id === newest;
}

function took(step) {
  if (!step.started_at) return "";
  const end = step.ended_at || (Date.now() / 1000);
  const seconds = end - step.started_at;
  if (seconds < 1) return `${Math.round(seconds * 1000)}ms`;
  if (seconds < 90) return `${seconds.toFixed(1)}s`;
  return `${Math.floor(seconds / 60)}m${String(Math.floor(seconds % 60)).padStart(2, "0")}s`;
}

// One line of it, for a step that is closed. The first line of a model reply is
// usually the sentence saying what it thinks it is doing, which is the line
// worth showing. Tool output opens with its own banner instead — the real
// `typecheck` step leads with `> path-forge@0.1.0 typecheck` and puts the
// error four lines down — so a diagnostic wins where the output has one, and
// the banner is skipped where it does not.
const BANNER = /^[>$#]\s|^(?:npm|yarn|pnpm|Running|Compiling|Godot Engine)\b/;
const DIAGNOSTIC = /\berror\b|\bfailed\b|\bwarning\b|^\S+[:(]\d+/i;

function peek(detail, kind) {
  const lines = (detail || "").split("\n").map(l => l.trim()).filter(Boolean);
  // A model reply is read from the top: the first line is the sentence saying
  // what it is about to do. Hunting for a diagnostic inside one finds whatever
  // line of the code it emitted happens to contain the word — on the real
  // ticket, `return { ok: false, error: "empty level" };` in place of `I see
  // the issue now. The problem is that I'm using if (result.ok)...`.
  const said = kind === "voice"
    ? lines.find(l => !BANNER.test(l))
    : lines.find(l => DIAGNOSTIC.test(l)) || lines.find(l => !BANNER.test(l));
  return (said || lines[0] || "").slice(0, 200);
}

function renderSteps(steps) {
  if (!steps.length) return '<li class="empty">Nothing yet.</li>';
  const newest = steps.length ? steps[0].id : 0;
  return steps.map(s => {
    const running = s.status === "running";
    const open = !running && s.detail && isOpen(s, newest);
    const kind = VOICE.test(s.name) ? "voice" : "tool";
    return `
    <li class="step ${kind} ${esc(s.status)}" data-id="${s.id}">
      <div class="head" onclick="toggleStep(${s.id})">
        <span class="caret">${s.detail ? (open ? "▾" : "▸") : "\u00a0"}</span>
        <span class="id">${esc(s.ticket || "—")}</span>
        <span class="title">${esc(s.name)}</span>
        ${open || running ? "" : `<span class="peek">${esc(peek(s.detail, kind))}</span>`}
        <span class="took" data-since="${running ? s.started_at : ""}">${esc(took(s))}</span>
        <span class="pill ${esc(s.status)}">${running ? '<i class="pulse"></i> ' : ""}${esc(s.status)}</span>
      </div>
      ${open ? `<pre class="snip">${esc(s.detail)}</pre>` : ""}
    </li>`;
  }).join("");
}

function toggleStep(id) {
  if (opened.has(id)) { opened.delete(id); closed.add(id); }
  else { closed.delete(id); opened.add(id); }
  $("steps").innerHTML = renderSteps(lastSteps);
}

// Kept so a toggle can re-render without waiting for the next poll.
let lastSteps = [];

// The elapsed time on a running step, ticked without re-rendering the panel —
// a full re-render every second would fight the scroll position of whatever is
// open above it.
setInterval(() => {
  document.querySelectorAll("#steps .took[data-since]").forEach(node => {
    const since = parseFloat(node.dataset.since);
    if (!since) return;
    node.textContent = took({ started_at: since, ended_at: 0 });
  });
}, 1000);

async function refresh() {
  let state;
  try { state = await (await fetch("/api/state")).json(); }
  catch { $("status").textContent = "disconnected"; $("status").className = "status failed"; return; }

  const run = state.run;
  const status = run ? run.status : "idle";
  $("status").textContent = status.replace("_", " ");
  $("status").className = "status " + status;

  $("goal").textContent = run ? (run.goal || "(no goal recorded)") : "No run yet.";

  const done = state.progress ? state.progress.done : 0;
  const total = state.progress ? state.progress.total : 0;
  $("progress").textContent = total ? `${done}/${total} tickets` : "";
  $("barfill").style.width = total ? `${(done / total) * 100}%` : "0";

  // WAITING_BUDGET is the state worth explaining rather than just colouring:
  // it means the loop is alive and will resume on its own.
  $("notice").innerHTML = (status === "waiting_budget" || (run && run.note && status !== "running"))
    ? `<p class="notice">${esc(run.note || "Waiting for a usage window to reopen.")}</p>` : "";

  $("tickets").innerHTML = renderTickets(state.tickets || []);
  lastSteps = state.steps || [];
  $("steps").innerHTML = renderSteps(lastSteps);
  $("usage").innerHTML = (state.usage || [])
    .map(u => `<tr><td>${esc(u.model)}</td><td>${u.calls}</td><td>${esc(u.display)}</td></tr>`)
    .join("") || '<tr><td colspan="3" class="empty">No calls yet.</td></tr>';
}

let lastEventId = 0;
function connectEvents() {
  const source = new EventSource(`/api/events?after=${lastEventId}`);
  source.onmessage = (message) => {
    const event = JSON.parse(message.data);
    lastEventId = Math.max(lastEventId, event.id);
    const line = document.createElement("div");
    line.className = event.level;
    line.innerHTML = `<time>${clock(event.ts)}</time><span>${esc(event.message)}</span>`;
    $("log").prepend(line);
    while ($("log").childElementCount > 300) $("log").lastElementChild.remove();
    refresh();
  };
  // Reconnect from the last id seen, so the gap replays instead of vanishing.
  source.onerror = () => { source.close(); setTimeout(connectEvents, 3000); };
}

refresh();
connectEvents();
setInterval(refresh, 5000);
</script>
</body>
</html>
